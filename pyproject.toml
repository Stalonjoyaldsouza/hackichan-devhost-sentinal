[project]
name = "sentinel"
version = "0.1.0"
description = "AI agent security SDK: analyse a business project, pick monitoring points, guard them at runtime. Includes the Sentinel control plane (policy enforcement, data-flow security, outcome verification, watchdog)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "groq>=1.7.0",
    "pydantic[email]>=2.7,<3",
    "pyyaml>=6.0,<7",
]

[project.scripts]
sentinel = "sentinel.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sentinel"]

[tool.hatch.build.targets.wheel.force-include]
"policies/default.yaml" = "sentinel/data/default.yaml"
"examples/support_bot" = "sentinel/data/examples/support_bot"
"examples/guidelines" = "sentinel/data/examples/guidelines"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "E501", "E702"]
